name: Monitor Open Source Star Rank freshness

on:
  schedule:
    # 03:15 Asia/Shanghai, after all three valid-window collection attempts.
    - cron: "15 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-source-star-rank-watchdog
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      failure_component: ${{ steps.freshness_status.outputs.failure_component }}
      failure_fingerprint: ${{ steps.freshness_status.outputs.failure_fingerprint }}
      failure_stage: ${{ steps.freshness_status.outputs.failure_stage }}
    steps:
      - name: Checkout monitoring helpers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Read latest data branch index
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/star-rank-data:refs/remotes/origin/star-rank-data
          git show refs/remotes/origin/star-rank-data:public/index.json > "$RUNNER_TEMP/data-index.json"

      - name: Check data branch freshness
        id: data_freshness
        run: python tools/check_star_rank_freshness.py --index "$RUNNER_TEMP/data-index.json" --require-today --require-valid-capture

      - name: Check published site freshness
        id: site_freshness
        env:
          SITE_INDEX: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/index.json
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/site-index.json" "$SITE_INDEX"
          python tools/check_star_rank_freshness.py --index "$RUNNER_TEMP/site-index.json" --require-today --require-valid-capture
          cmp "$RUNNER_TEMP/data-index.json" "$RUNNER_TEMP/site-index.json"

      - name: Classify freshness failure
        id: freshness_status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          DATA_OUTCOME: ${{ steps.data_freshness.outcome }}
          SITE_OUTCOME: ${{ steps.site_freshness.outcome }}
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            component="none"
            stage="none"
            fingerprint="none"
          elif [[ "$DATA_OUTCOME" == "failure" || "$DATA_OUTCOME" == "skipped" ]]; then
            component="data_freshness"
            stage="data-branch"
            fingerprint="data_freshness:data-branch"
          else
            component="pages_publish"
            stage="published-site-or-consistency"
            fingerprint="pages_publish:site-consistency"
          fi
          echo "failure_component=$component" >> "$GITHUB_OUTPUT"
          echo "failure_stage=$stage" >> "$GITHUB_OUTPUT"
          echo "failure_fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

  incident:
    if: always()
    needs: freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout incident helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Open or close freshness incident
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.freshness.result }}
          FAILURE_COMPONENT: ${{ needs.freshness.outputs.failure_component }}
          FAILURE_FINGERPRINT: ${{ needs.freshness.outputs.failure_fingerprint }}
          FAILURE_STAGE: ${{ needs.freshness.outputs.failure_stage }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESULT" == "success" ]]; then
            python tools/star_rank_incident.py \
              --status close \
              --component consistency \
              --details "数据分支与公开站点均为今日有效版本且内容一致：$RUN_URL"
          else
            component="${FAILURE_COMPONENT:-data_freshness}"
            fingerprint="${FAILURE_FINGERPRINT:-data_freshness:unknown}"
            stage="${FAILURE_STAGE:-unknown}"
            python tools/star_rank_incident.py \
              --status open \
              --component "$component" \
              --fingerprint "$fingerprint" \
              --details "03:15 阶段 $stage 新鲜度或一致性检查失败：$RUN_URL"
          fi
