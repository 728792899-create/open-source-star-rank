version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "01:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, star-rank]
    groups:
      astro-stack:
        patterns:
          - astro
          - "@astrojs/*"
      browser-quality:
        patterns:
          - "@axe-core/playwright"
          - "@lhci/cli"
          - "@playwright/test"
        update-types:
          - minor
          - patch
      site-tooling:
        patterns:
          - "@resvg/resvg-js"
          - typescript
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "01:45"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, star-rank]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /auth-worker
    schedule:
      interval: weekly
      day: monday
      time: "01:40"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, star-rank, auth]
    groups:
      cloudflare-worker:
        patterns:
          - "@cloudflare/*"
          - wrangler
      worker-tooling:
        patterns:
          - typescript
          - vitest
        update-types:
          - minor
          - patch
